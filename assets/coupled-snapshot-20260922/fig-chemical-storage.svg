<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Chemical storage amplitude under two priors</title>
<desc id="d">Four rows on a shared axis of the chemical storage amplitude. The synthetic truth is 0.600; a shaded band marks the recovered tolerance of plus or minus 0.125. The prior centre is 0 with a standard deviation of 0.5. The fit under the base prior reaches 0.2608, which is 0.678 prior standard deviations short of the truth and outside the band. The prespecified control with the prior standard deviation tripled reaches 0.5162, inside the band at 0.168 base prior standard deviations.</desc>
