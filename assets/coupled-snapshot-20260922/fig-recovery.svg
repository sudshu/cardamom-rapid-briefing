<title id="t">Parameter recovery in fitted coordinates, against the prespecified tolerance</title>
<desc id="d">Eight horizontal rows, one per parameter, showing the estimate minus the truth in the fitted coordinate divided by the base prior standard deviation. The fitted coordinate is the logarithm for the four input multipliers and the two decay rates, and the signed amplitude itself for the two storage fields. Water input west -0.010, water input east +0.013, chemical input west -0.030, chemical input east -0.075, decay west +0.021, decay east -0.083, water storage amplitude +0.048 all fall inside the shaded recovered band of plus or minus 0.25. The chemical storage amplitude is -0.678, outside both the recovered and the marginal band.</desc>
