<title id="t">Held-out concentration: prediction against synthetic truth</title>
<desc id="d">Scatter plot with a one-to-one line. Ten held-out measurement locations. Filled markers are the fitted prediction, open markers the prior mean with no fitting. Fitted values sit close to the one-to-one line, with a nonzero RMSE of 0.01189 mg/L; prior-mean values sit visibly off it. Truth to fitted pairs in mg/L: 1.11→1.1, 1.06→1.06, 1.13→1.13, 1.02→1.01, 0.874→0.867, 0.533→0.534, 0.778→0.745, 0.108→0.114, 0.555→0.557, 0.347→0.354.</desc>
